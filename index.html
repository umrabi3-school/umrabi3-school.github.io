<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثانوية أم الربيعين للمتفوقين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF2F5;--surface:#fff;--ink:#17263B;--mute:#5E6C80;--line:#D8E0E8;--accent:#F2B705;--accent-ink:#2A2000;--ok:#1F7A55;--no:#C23B22;--okbg:#E2F3EA;--nobg:#FBE6E1}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1826;--surface:#182436;--ink:#E8EEF5;--mute:#93A3B8;--line:#2A3A52;--accent:#F2B705;--accent-ink:#2A2000;--ok:#58C79A;--no:#FF8A74;--okbg:#14352A;--nobg:#3A1D18}}
:root[data-theme="dark"]{--bg:#0F1826;--surface:#182436;--ink:#E8EEF5;--mute:#93A3B8;--line:#2A3A52;--ok:#58C79A;--no:#FF8A74;--okbg:#14352A;--nobg:#3A1D18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;line-height:1.3;font-weight:800;margin:0}
h2{font-size:18px;margin:0 0 10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:20px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--mute);padding:8px 2px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;color:var(--mute);font-size:14px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);font-weight:500;padding:5px 10px;font-size:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stu{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.stu:last-child{border:0}
.tg{display:flex;gap:6px}
.tg button{font:inherit;font-weight:700;border:1px solid var(--line);background:none;color:var(--mute);border-radius:9px;padding:4px 14px;cursor:pointer}
.tg .p.on{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.tg .a.on{background:var(--nobg);color:var(--no);border-color:var(--no)}
.sum{color:var(--mute);font-size:14px;margin:8px 0 12px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border:0}
.bar{width:5px;align-self:stretch;border-radius:3px;background:var(--accent);flex:none}
.bar.abs{background:var(--no)}
.grow{flex:1}
.meta{font-size:13px;color:var(--mute)}
.new{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-inline-start:6px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--mute);border-radius:20px;padding:4px 14px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;align-items:center;font-size:14px}.cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}.cell.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}.hello{color:var(--mute);margin:0 0 12px}.login{max-width:380px;margin:40px auto}.login input{margin-bottom:12px}.err{color:var(--no);font-weight:700;margin:0 0 10px}.btn.full{width:100%}.cr{font-family:monospace;direction:ltr;text-align:left;font-size:14px;padding:3px 0}</style>
</head>
<body>
<div class="wrap">
<header><h1>ثانوية أم الربيعين<br>للمتفوقين</h1><button id="out" class="btn ghost" style="display:none" onclick="auth.signOut()">خروج</button></header>
<main id="app"><div class="empty">جارٍ التحميل…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyCRwDbZYFyWzmqhyYqbALdn5jk9ENEMiTA",authDomain:"umrabi3-schooll.firebaseapp.com",projectId:"umrabi3-schooll",storageBucket:"umrabi3-schooll.firebasestorage.app",messagingSenderId:"715119800244",appId:"1:715119800244:web:066e028bc55154bbe8cce1"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const STAGES=["الأول المتوسط","الثاني المتوسط","الثالث المتوسط","الرابع الإعدادي","الخامس الإعدادي","السادس الإعدادي"],SECS=["أ","ب","ج","د"];
const em=c=>c.trim().toLowerCase()+"@umrabi3.school",today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d).toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=o=>o.st+"-"+o.sc,label=o=>STAGES[o.st]+" - شعبة "+SECS[o.sc],byName=(a,b)=>a.name.localeCompare(b.name,"ar");
const sel=window.sel={st:0,sc:0,date:today()};
let P=null,view="boot",setup=false,busy=false,err="",tab="abs",marks={},filter="all",creds=[],unsubs=[],data={students:[],teachers:[],abs:[],hw:[]};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
const paint=()=>{if(!document.activeElement.matches("input,textarea,select"))render()};
const fail=e=>toast("خطأ: "+(e.code||e.message));

auth.onAuthStateChanged(async u=>{
  if(busy)return;
  unsubs.forEach(f=>f());unsubs=[];P=null;
  if(!u){try{setup=!(await db.doc("meta/admin").get()).exists}catch(e){setup=false}view="login";render();return}
  await enter(u);
});
setTimeout(()=>{if(view=="boot")app.innerHTML='<div class="empty">تعذّر التحميل. افتح التطبيق من رابط https وليس من ملف على الجوال.</div>'},6000);
async function enter(u){
  try{const d=await db.doc("users/"+u.uid).get();
    if(!d.exists){err="هذا الحساب غير مفعّل، راجع المدير";await auth.signOut();return}
    P={id:u.uid,...d.data()};view="app";watch();render()}catch(e){fail(e)}
}
function watch(){
  unsubs.forEach(f=>f());unsubs=[];data={students:[],teachers:[],abs:[],hw:[]};
  const q=(c,f,v,n)=>unsubs.push(db.collection(c).where(f,"==",v).onSnapshot(s=>{data[n]=s.docs.map(d=>({id:d.id,...d.data()}));paint()},fail));
  if(P.role=="student"){q("homework","k",P.k,"hw");q("absences","uid",P.id,"abs");unsubs.push(db.doc("users/"+P.id).onSnapshot(s=>{if(s.exists){P={id:P.id,...s.data()};paint()}},fail))}
  else{const k=key(sel);q("users","k",k,"students");q("homework","k",k,"hw");q("absences","k",k,"abs");if(P.role=="admin")q("users","role","teacher","teachers")}
}
function pick(){return `<div class="row"><div><label for="pst">المرحلة</label><select id="pst" onchange="sel.st=+this.value;chg()">${STAGES.map((s,i)=>`<option value="${i}" ${i==sel.st?"selected":""}>${s}</option>`).join("")}</select></div><div><label for="psc">الشعبة</label><select id="psc" onchange="sel.sc=+this.value;chg()">${SECS.map((s,i)=>`<option value="${i}" ${i==sel.sc?"selected":""}>${s}</option>`).join("")}</select></div></div>`}
function chg(){marks={};watch();render()}
function render(){
  document.getElementById("out").style.display=P?"":"none";
  if(view=="boot")return;
  app.innerHTML=!P?loginV():P.role=="admin"?adminV():P.role=="teacher"?teacherV():studentV();
}
function loginV(){
  return setup?`<div class="panel login"><h2>إعداد حساب المدير (أول مرة)</h2><p class="meta">الكود: admin — اختر كلمة سر قوية (6 أحرف فأكثر)</p><label for="sp">كلمة السر</label><input id="sp" type="password" autocomplete="new-password"><button class="btn full" onclick="doSetup()">إنشاء حساب المدير</button></div>`
  :`<div class="panel login"><h2>تسجيل الدخول</h2>${err?`<p class="err">${err}</p>`:""}<label for="lc">الكود</label><input id="lc" autocapitalize="off" dir="ltr"><label for="lp">كلمة السر</label><input id="lp" type="password" dir="ltr" onkeydown="if(event.key=='Enter')login()"><button class="btn full" onclick="login()">دخول</button></div>`;
}
async function login(){err="";try{await auth.signInWithEmailAndPassword(em(lc.value),lp.value)}catch(e){err="الكود أو كلمة السر غير صحيحة";render()}}
async function doSetup(){
  if(sp.value.length<6){toast("كلمة السر 6 أحرف على الأقل");return}
  busy=true;
  try{const c=await auth.createUserWithEmailAndPassword(em("admin"),sp.value),b=db.batch();
    b.set(db.doc("users/"+c.user.uid),{role:"admin",name:"أستاذ عيسى",code:"admin",reads:{}});b.set(db.doc("meta/admin"),{uid:c.user.uid});
    await b.commit();busy=false;await enter(c.user)}
  catch(e){busy=false;fail(e)}
}
async function mk(role,names,k){
  let sec;try{sec=firebase.app("sec")}catch(e){sec=firebase.initializeApp(CFG,"sec")}
  const out=[];
  for(const name of names)for(let t=0;t<6;t++){
    const code=(role=="teacher"?"T":"S")+Math.floor(1000+Math.random()*9000),pw=String(Math.floor(100000+Math.random()*900000));
    try{const c=await sec.auth().createUserWithEmailAndPassword(em(code),pw);await sec.auth().signOut();
      const p={role,name,code,reads:{}};if(k)p.k=k;await db.doc("users/"+c.user.uid).set(p);out.push({name,code,pw});break}
    catch(e){if(e.code!="auth/email-already-in-use"){fail(e);return out}}
  }
  return out;
}
function credsV(){return creds.length?`<div class="panel"><h2>بيانات الدخول — احفظها الآن</h2><p class="meta">لن تظهر مرة ثانية. سلّم كل شخص كوده وكلمة سره.</p>${creds.map(c=>`<div class="cr">${esc(c.name)}: ${c.code} / ${c.pw}</div>`).join("")}<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="copyC()">نسخ الكل</button><button class="btn ghost" onclick="creds=[];render()">إغلاق</button></div></div>`:""}
function copyC(){navigator.clipboard.writeText(creds.map(c=>c.name+": "+c.code+" / "+c.pw).join("\n")).then(()=>toast("تم النسخ"),()=>toast("تعذّر النسخ"))}
const lines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);
async function addSt(){const v=lines(nm.value);if(!v.length){toast("اكتب اسماً واحداً على الأقل");return}toast("جارٍ إنشاء الحسابات…");creds=await mk("student",v,key(sel));render()}
async function addT(){const v=lines(tn.value);if(!v.length){toast("اكتب اسم المدرس");return}toast("جارٍ الإنشاء…");creds=await mk("teacher",v);render()}
function delU(id){if(confirm("حذف هذا الحساب؟"))db.doc("users/"+id).delete().catch(fail)}
function adminV(){
  const S=data.students.slice().sort(byName),T=data.teachers.slice().sort(byName);
  return `<p class="hello">أهلاً ${esc(P.name)}</p>`+credsV()+pick()+`<div class="panel"><h2>طلاب ${label(sel)} (${S.length})</h2><label for="nm">إضافة طلاب (اسم في كل سطر)</label><textarea id="nm" rows="3"></textarea><div style="margin:10px 0"><button class="btn" onclick="addSt()">إنشاء حسابات</button></div>${S.length?S.map(s=>`<div class="stu"><span>${esc(s.name)} <span class="meta">${s.code}</span></span><button class="btn ghost" onclick="delU('${s.id}')">حذف</button></div>`).join(""):'<div class="empty">لا يوجد طلاب في هذه الشعبة</div>'}</div>
  <div class="panel"><h2>المدرسون (${T.length})</h2><label for="tn">اسم المدرس</label><input id="tn"><div style="margin:10px 0"><button class="btn" onclick="addT()">إنشاء حساب مدرس</button></div>${T.map(s=>`<div class="stu"><span>${esc(s.name)} <span class="meta">${s.code}</span></span><button class="btn ghost" onclick="delU('${s.id}')">حذف</button></div>`).join("")}</div>`;
}
function teacherV(){return `<p class="hello">أهلاً ${esc(P.name)}</p>`+pick()+`<div class="tabs"><button class="${tab=="abs"?"on":""}" onclick="tab='abs';render()">الغياب</button><button class="${tab=="hw"?"on":""}" onclick="tab='hw';render()">الواجبات</button></div>`+(tab=="abs"?absTab():hwTab())}
function absTab(){
  const R=data.students.slice().sort(byName),n=R.filter(s=>marks[s.id]=="a").length,A=data.abs.slice().sort((a,b)=>b.time-a.time).slice(0,8);
  return `<div class="panel"><h2>تسجيل الغياب</h2><label for="dt">التاريخ</label><input type="date" id="dt" value="${sel.date}" onchange="sel.date=this.value" style="margin-bottom:8px">${R.length?R.map(s=>`<div class="stu"><span>${esc(s.name)}</span><div class="tg"><button class="p ${marks[s.id]!="a"?"on":""}" onclick="mark('${s.id}','p')">حاضر</button><button class="a ${marks[s.id]=="a"?"on":""}" onclick="mark('${s.id}','a')">غائب</button></div></div>`).join("")+`<p class="sum">${n} غائب من ${R.length}</p><button class="btn" onclick="saveAbs()">حفظ وإبلاغ الطلاب</button>`:'<div class="empty">لا يوجد طلاب في هذه الشعبة. يضيفهم المدير.</div>'}</div><div class="panel"><h2>آخر الغيابات</h2>${A.length?A.map(a=>`<div class="item"><div class="bar abs"></div><div class="grow"><b>${esc(a.name)}</b><div class="meta">${fmt(a.date)}</div></div><button class="btn ghost" onclick="delDoc('absences','${a.id}')">حذف</button></div>`).join(""):'<div class="empty">لم يُسجَّل غياب بعد</div>'}</div>`;
}
function mark(id,v){marks[id]=v;render()}
function delDoc(c,id){db.collection(c).doc(id).delete().catch(fail)}
async function saveAbs(){
  const b=db.batch(),t=Date.now();let n=0;
  data.students.filter(s=>marks[s.id]=="a"&&!data.abs.some(a=>a.uid==s.id&&a.date==sel.date)).forEach(s=>{b.set(db.collection("absences").doc(),{k:key(sel),uid:s.id,name:s.name,date:sel.date,time:t});n++});
  try{if(n)await b.commit();marks={};toast(n?`أُرسل ${n} تبليغ غياب`:"لا غياب جديد");render()}catch(e){fail(e)}
}
function hwTab(){
  const H=data.hw.slice().sort((a,b)=>b.time-a.time);
  return `<div class="panel"><h2>واجب جديد</h2><div class="row"><div><label for="hs">المادة</label><input id="hs" placeholder="الرياضيات"></div><div><label for="hd">موعد التسليم</label><input type="date" id="hd" value="${today()}"></div></div><div style="margin-bottom:10px"><label for="ht">وصف الواجب</label><textarea id="ht" rows="2"></textarea></div><button class="btn" onclick="addHw()">نشر الواجب</button></div><div class="panel"><h2>واجبات هذه الشعبة</h2>${H.length?H.map(h=>`<div class="item"><div class="bar"></div><div class="grow"><b>${esc(h.subject)}</b><div>${esc(h.text)}</div><div class="meta">التسليم: ${fmt(h.due)}</div></div><button class="btn ghost" onclick="delDoc('homework','${h.id}')">حذف</button></div>`).join(""):'<div class="empty">لا توجد واجبات</div>'}</div>`;
}
function addHw(){
  const subject=hs.value.trim(),text=ht.value.trim();
  if(!subject||!text){toast("اكتب المادة ووصف الواجب");return}
  db.collection("homework").add({k:key(sel),subject,text,due:hd.value,time:Date.now()}).then(()=>{hs.value=ht.value="";toast("نُشر الواجب وأُبلغ الطلاب")}).catch(fail);
}
function items(){
  return data.hw.map(h=>({id:h.id,type:"hw",title:"واجب جديد في "+h.subject,body:h.text+" — التسليم "+fmt(h.due),time:h.time})).concat(data.abs.map(a=>({id:a.id,type:"abs",title:"تم تسجيل غيابك",body:fmt(a.date),time:a.time}))).sort((a,b)=>b.time-a.time);
}
const isR=n=>!!(P.reads&&P.reads[n.id]);
function studentV(){
  const all=items(),unread=all.filter(n=>!isR(n)).length,list=all.filter(n=>filter=="all"||n.type==filter);
  return `<p class="hello">أهلاً ${esc(P.name)} — ${STAGES[+P.k.split("-")[0]]} شعبة ${SECS[+P.k.split("-")[1]]}</p><div class="chips"><button class="${filter=="all"?"on":""}" onclick="filter='all';render()">الكل${unread?` (${unread} جديد)`:""}</button><button class="${filter=="hw"?"on":""}" onclick="filter='hw';render()">الواجبات</button><button class="${filter=="abs"?"on":""}" onclick="filter='abs';render()">الغياب</button></div><div class="panel">${list.length?list.map(n=>`<div class="item" ${isR(n)?"":`onclick="readN('${n.id}')" style="cursor:pointer"`}><div class="bar ${n.type=="abs"?"abs":""}"></div><div class="grow"><b>${esc(n.title)}</b>${isR(n)?"":'<span class="new" aria-label="جديد"></span>'}<div>${esc(n.body)}</div><div class="meta">${new Date(n.time).toLocaleString("ar",{dateStyle:"medium",timeStyle:"short"})}</div></div></div>`).join(""):'<div class="empty">لا توجد تبليغات بعد</div>'}${unread?'<button class="btn ghost" onclick="readAll()">تعليم الكل كمقروء</button>':""}</div>`;
}
function readN(id){db.doc("users/"+P.id).update({["reads."+id]:true}).catch(fail)}
function readAll(){const u={};items().forEach(n=>u["reads."+n.id]=true);db.doc("users/"+P.id).update(u).catch(fail)}
</script>
</body>
</html>
